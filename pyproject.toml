[project]
name = "server-remote-system"
version = "0.1.0"
description = "Approval-first research compute control plane"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "pymysql>=1.1,<2",
  "cryptography>=44",
  "pydantic-settings>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "httpx>=0.28,<1",
  "asyncssh>=2.20,<3",
  "pyyaml>=6,<7",
  "argon2-cffi>=23",
]

[project.scripts]
srs = "srs.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "respx>=0.22,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/srs", "infra", "workloads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/srs/app.py" = ["B008"] # FastAPI dependency declarations are evaluated once when the app is built.
