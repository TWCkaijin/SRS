# Declaration only. Creation/start requires a reviewed local operation plan.
vmType: vz
arch: aarch64
cpus: 2
memory: 4GiB
disk: 30GiB
images:
  - location: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-arm64.img
mounts: []
containerd:
  system: false
  user: false
portForwards:
  - guestPort: 8000
    hostIP: 127.0.0.1
    hostPort: 18000
# Before approval: pin the image to its verified SHA256, allocate private VM
# networking, and review the package/config plans. No automatic provision hook.
